<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Magic AR Gesture</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #camera {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            z-index: 1;
        }

        canvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 2;
        }

    </style>

</head>

<body>

    <video
        id="camera"
        autoplay
        playsinline
    ></video>

    <script
        type="module"
        src="/src/main.js"
    ></script>

</body>

</html>
